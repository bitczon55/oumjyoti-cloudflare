<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OUMJYOTI — भक्ति • सेवा • मानवता</title>
  <style>
    :root {
      --bg: #0f0508;
      --bg2: #14070b;
      --card: #1c0e12;
      --card2: #211015;
      --gold: #f3ba2f;
      --gold2: #ffe898;
      --text: #f5f5f5;
      --muted: #c8b9b9;
      --line: rgba(243,186,47,0.24);
      --shadow: 0 12px 35px rgba(0,0,0,0.35);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, rgba(243,186,47,0.08), transparent 38%), var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    body.interface-open { overflow: hidden; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .container { width: min(1180px, calc(100% - 30px)); margin: auto; }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,5,8,0.94); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .nav { min-height: 72px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; background: transparent; border: 0; color: inherit; }
    .brand-title { color: var(--gold2); font-weight: 900; letter-spacing: 1px; font-size: 19px; }
    .brand-sub { color: var(--muted); font-size: 11px; }

    .nav-links { display: flex; gap: 8px; }
    .nav-links button { border: 0; background: transparent; color: var(--muted); padding: 9px 12px; border-radius: 10px; }
    .nav-links button:hover { color: var(--gold2); background: rgba(243,186,47,0.08); }
    .nav-login { color: #120a00 !important; background: linear-gradient(135deg, var(--gold), var(--gold2)) !important; font-weight: 800; }

    .hero { text-align: center; padding: 100px 0 60px; border-bottom: 1px solid var(--line); }
    .hero h1 { color: var(--gold2); font-size: clamp(32px, 6vw, 56px); margin: 0; }
    .hero p { color: #eee0e0; max-width: 700px; margin: 20px auto; line-height: 1.8; }

    .btn { border: 1px solid var(--line); border-radius: 12px; padding: 12px 20px; background: var(--card); color: var(--gold2); font-weight: 800; transition: .2s; }
    .btn:hover { border-color: var(--gold); transform: translateY(-2px); }
    .btn-primary { color: #160b00; background: linear-gradient(135deg, var(--gold), var(--gold2)); border-color: transparent; }
    .btn-small { padding: 6px 12px; font-size: 13px; border-radius: 8px; }

    #interfaceArea { position: fixed; inset: 0; z-index: 1000; display: none; background: var(--bg); overflow-y: auto; }
    #interfaceArea.show { display: block; }
    .interface-page { min-height: 100vh; padding: 22px; }
    .interface-inner { width: min(1000px, 100%); margin: 0 auto; padding-bottom: 50px; }
    .interface-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; border-bottom: 1px solid var(--line); padding-bottom: 15px; }
    .interface-title { color: var(--gold2); margin: 0; font-size: 28px; }
    .close-interface { border: 1px solid var(--line); background: var(--card); color: var(--gold2); border-radius: 10px; padding: 8px 14px; font-weight: 800; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; color: var(--gold2); margin-bottom: 8px; font-size: 14px; font-weight: 700; }
    .form-control { width: 100%; border: 1px solid var(--line); background: #10060a; color: var(--text); padding: 12px; border-radius: 10px; outline: none; }
    .form-control:focus { border-color: var(--gold); }
    .form-control[readonly] { background: #18090e; opacity: 0.8; cursor: not-allowed; }

    .status-pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .status-Pending { background: rgba(243,186,47,0.15); color: var(--gold); }
    .status-In-Review { background: rgba(0,150,255,0.15); color: #70c0ff; }
    .status-Replied { background: rgba(70,190,100,0.15); color: #9effb3; }
    .status-Closed { background: rgba(180,50,50,0.15); color: #ffaaaa; }

    .reply-box { background: rgba(243,186,47,0.06); border-left: 3px solid var(--gold); padding: 14px; border-radius: 8px; margin-top: 12px; }
    .reply-box strong { color: var(--gold2); display: block; margin-bottom: 4px; }

    .message { display: none; padding: 12px; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--line); }
    .message.show { display: block; }
    .message.error { background: rgba(180,40,40,0.2); color: #ffb4b4; border-color: #a33; }
    .message.success { background: rgba(40,180,80,0.2); color: #b9ffca; border-color: #3a8; }
  </style>
</head>
<body>

<header>
  <div class="container nav">
    <button class="brand" onclick="goHome()">
      <div>
        <div class="brand-title">OUMJYOTI</div>
        <div class="brand-sub">भक्ति • सेवा • मानवता</div>
      </div>
    </button>
    <nav class="nav-links">
      <button onclick="goHome()">Home</button>
      <button onclick="openInterface('feedback')">Feedback</button>
      <button id="authButton" class="nav-login" onclick="handleAuthButton()">Login</button>
    </nav>
  </div>
</header>

<main id="home">
  <section class="hero">
    <div class="container">
      <h1>भक्ति से सेवा, सेवा से मानवता</h1>
      <p>OUMJYOTI का उद्देश्य जरूरतमंदों, गौ माता, बुजुर्गों और समाज के हर वर्ग तक सेवा पहुँचाना है।</p>
      <button class="btn btn-primary" onclick="handleAuthButton()">Member Portal Me Jayein</button>
    </div>
  </section>
</main>

<div id="interfaceArea"></div>

<script>
let currentUser = null;

document.addEventListener("DOMContentLoaded", () => {
  checkSession();
});

async function apiFetch(url, options = {}) {
  const res = await fetch(url, { credentials: "same-origin", ...options });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

async function checkSession() {
  try {
    const data = await apiFetch("/api/me");
    if (data.authenticated) {
      currentUser = data.user;
      updateAuthButton();
    }
  } catch (e) {
    currentUser = null;
    updateAuthButton();
  }
}

function updateAuthButton() {
  const btn = document.getElementById("authButton");
  if (btn) btn.textContent = currentUser ? "My Profile" : "Login";
}

function handleAuthButton() {
  if (currentUser) {
    if (currentUser.role === "admin") {
      renderAdminDashboard();
    } else {
      renderMemberPortal();
    }
  } else {
    renderLoginInterface();
  }
}

function showInterface(html) {
  const area = document.getElementById("interfaceArea");
  area.innerHTML = html;
  area.classList.add("show");
  document.body.classList.add("interface-open");
}

function closeInterface() {
  const area = document.getElementById("interfaceArea");
  area.classList.remove("show");
  area.innerHTML = "";
  document.body.classList.remove("interface-open");
}

function goHome() { closeInterface(); }

// --- MEMBER PORTAL (Profile + Feedback Stream) ---
async function renderMemberPortal() {
  showInterface(`
    <div class="interface-page">
      <div class="interface-inner">
        <div class="interface-top">
          <h1 class="interface-title">Member Profile Portal</h1>
          <button class="close-interface" onclick="closeInterface()">✕ बंद करें</button>
        </div>
        
        <div class="card">
          <h2 style="color:var(--gold2);margin-top:0">My Profile</h2>
          <div id="profileMsg" class="message"></div>
          <form onsubmit="updateProfile(event)">
            <div class="form-group"><label>Member ID (System Generated)</label><input class="form-control" value="${escapeHtml(currentUser.member_id || 'Generating...')}" readonly></div>
            <div class="form-group"><label>Full Name</label><input class="form-control" id="profName" value="${escapeHtml(currentUser.name)}" required></div>
            <div class="form-group"><label>Place / Location</label><input class="form-control" id="profPlace" value="${escapeHtml(currentUser.place)}" required></div>
            <div class="form-group"><label>Email Address</label><input class="form-control" id="profEmail" type="email" value="${escapeHtml(currentUser.email)}" required></div>
            <div class="form-group"><label>Mobile Number</label><input class="form-control" value="${escapeHtml(currentUser.mobile)}" readonly></div>
            <div class="form-group"><label>PAN (Masked - Admin Controlled)</label><input class="form-control" value="${escapeHtml(currentUser.pan_masked || 'Not Provided')}" readonly></div>
            <div class="form-group"><label>Aadhaar (Masked - Admin Controlled)</label><input class="form-control" value="${escapeHtml(currentUser.aadhaar_masked || 'Not Provided')}" readonly></div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <button type="button" class="btn" style="float:right" onclick="logoutUser()">Logout</button>
          </form>
        </div>

        <div class="card">
          <h2 style="color:var(--gold2);margin-top:0">My Feedback & Admin Replies</h2>
          <button class="btn btn-small btn-primary" onclick="openInterface('feedback')" style="margin-bottom:15px">+ Naya Feedback Bhejein</button>
          <div id="myFeedbackList">Loading feedbacks...</div>
        </div>
      </div>
    </div>
  `);
  loadMyFeedbacks();
}

async function updateProfile(e) {
  e.preventDefault();
  const msg = document.getElementById("profileMsg");
  msg.className = "message show";
  msg.textContent = "Updating...";
  try {
    await apiFetch("/api/member/profile", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: document.getElementById("profName").value,
        place: document.getElementById("profPlace").value,
        email: document.getElementById("profEmail").value
      })
    });
    msg.className = "message show success";
    msg.textContent = "Profile updated successfully!";
    await checkSession();
  } catch (err) {
    msg.className = "message show error";
    msg.textContent = err.message;
  }
}

async function loadMyFeedbacks() {
  const box = document.getElementById("myFeedbackList");
  try {
    const data = await apiFetch("/api/member/feedback");
    const items = data.feedbacks || [];
    if (!items.length) {
      box.innerHTML = `<p style="color:var(--muted)">Aapne abhi tak koi feedback nahi bheja hai.</p>`;
      return;
    }
    box.innerHTML = items.map(item => `
      <div style="border-bottom:1px solid var(--line); padding:12px 0;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="status-pill status-${item.status.replace(' ', '-')}">${item.status}</span>
          <small style="color:var(--muted)">${new Date(item.created_at).toLocaleDateString()}</small>
        </div>
        <p style="margin:8px 0; color:var(--text);">${escapeHtml(item.message)}</p>
        ${item.admin_reply ? `
          <div class="reply-box">
            <strong>Admin Reply (${item.replied_at ? new Date(item.replied_at).toLocaleDateString() : ''}):</strong>
            <span>${escapeHtml(item.admin_reply)}</span>
          </div>
        ` : ''}
      </div>
    `).join("");
  } catch (err) {
    box.innerHTML = `<p style="color:#ffaaaa">Error loading feedback list.</p>`;
  }
}

// --- ADMIN DASHBOARD (Feedback Reply Management) ---
async function renderAdminDashboard() {
  showInterface(`
    <div class="interface-page">
      <div class="interface-inner">
        <div class="interface-top">
          <h1 class="interface-title">Admin Management Panel</h1>
          <button class="close-interface" onclick="closeInterface()">✕ बंद करें</button>
        </div>
        
        <div class="card">
          <h2 style="color:var(--gold2);margin-top:0">Member Feedbacks & Reply System</h2>
          <button class="btn btn-small" onclick="logoutUser()" style="float:right">Logout Admin</button>
          <div id="adminFeedbackTable">Loading all feedbacks...</div>
        </div>
      </div>
    </div>
  `);
  loadAdminFeedbacks();
}

async function loadAdminFeedbacks() {
  const box = document.getElementById("adminFeedbackTable");
  try {
    const data = await apiFetch("/api/admin/feedback");
    const items = data.feedback || [];
    if (!items.length) {
      box.innerHTML = `<p style="color:var(--muted)">Koi feedback praapt nahi hua hai.</p>`;
      return;
    }
    box.innerHTML = items.map(f => `
      <div class="card" style="background:#14070b; margin-top:15px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong>${escapeHtml(f.name)} (${escapeHtml(f.email)} | ${escapeHtml(f.mobile)})</strong>
          <span class="status-pill status-${f.status.replace(' ', '-')}">${f.status}</span>
        </div>
        <p style="margin:10px 0; background:#0a0305; padding:10px; border-radius:8px;">${escapeHtml(f.message)}</p>
        
        <form onsubmit="submitAdminReply(event, ${f.id})" style="margin-top:10px;">
          <div class="form-group">
            <label>Admin Reply Message:</label>
            <textarea class="form-control" id="reply_text_${f.id}" style="min-height:70px" required>${escapeHtml(f.admin_reply || '')}</textarea>
          </div>
          <div style="display:flex; gap:10px; align-items:center;">
            <select class="form-control" id="reply_status_${f.id}" style="width:auto">
              <option value="Replied" ${f.status === 'Replied' ? 'selected' : ''}>Replied</option>
              <option value="In Review" ${f.status === 'In Review' ? 'selected' : ''}>In Review</option>
              <option value="Closed" ${f.status === 'Closed' ? 'selected' : ''}>Closed</option>
              <option value="Pending" ${f.status === 'Pending' ? 'selected' : ''}>Pending</option>
            </select>
            <button type="submit" class="btn btn-primary btn-small">Send / Update Reply</button>
          </div>
        </form>
      </div>
    `).join("");
  } catch (err) {
    box.innerHTML = `<p style="color:#ffaaaa">Error loading feedback database.</p>`;
  }
}

async function submitAdminReply(e, feedbackId) {
  e.preventDefault();
  const reply = document.getElementById(`reply_text_${feedbackId}`).value;
  const status = document.getElementById(`reply_status_${feedbackId}`).value;
  try {
    await apiFetch("/api/admin/feedback/reply", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ feedback_id: feedbackId, admin_reply: reply, status: status })
    });
    alert("Reply sent successfully!");
    loadAdminFeedbacks();
  } catch (err) {
    alert("Failed to send reply: " + err.message);
  }
}

// --- FEEDBACK SUBMISSION & AUTH MODALS ---
function renderFeedbackInterface() {
  showInterface(`
    <div class="interface-page">
      <div class="interface-inner">
        <div class="interface-top">
          <h1 class="interface-title">Send Feedback</h1>
          <button class="close-interface" onclick="closeInterface()">✕ बंद करें</button>
        </div>
        <div class="card">
          <div id="fbMsg" class="message"></div>
          <form onsubmit="sendFeedback(event)">
            <div class="form-group"><label>Mobile Number</label><input class="form-control" id="fbMobile" value="${currentUser ? escapeHtml(currentUser.mobile) : ''}" required></div>
            <div class="form-group"><label>Email Address</label><input class="form-control" id="fbEmail" type="email" value="${currentUser ? escapeHtml(currentUser.email) : ''}" required></div>
            <div class="form-group"><label>Message</label><textarea class="form-control" id="fbText" style="min-height:120px" required></textarea></div>
            <button type="submit" class="btn btn-primary">Submit Feedback</button>
          </form>
        </div>
      </div>
    </div>
  `);
}

async function sendFeedback(e) {
  e.preventDefault();
  const msg = document.getElementById("fbMsg");
  msg.className = "message show";
  msg.textContent = "Sending...";
  try {
    await apiFetch("/api/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        mobile: document.getElementById("fbMobile").value,
        email: document.getElementById("fbEmail").value,
        message: document.getElementById("fbText").value
      })
    });
    msg.className = "message show success";
    msg.textContent = "Feedback sent successfully!";
    document.getElementById("fbText").value = "";
  } catch (err) {
    msg.className = "message show error";
    msg.textContent = err.message;
  }
}

function renderLoginInterface() {
  showInterface(`
    <div class="interface-page">
      <div class="interface-inner" style="max-width:450px;">
        <div class="interface-top">
          <h1 class="interface-title">Login</h1>
          <button class="close-interface" onclick="closeInterface()">✕ बंद करें</button>
        </div>
        <div class="card">
          <div id="loginMsg" class="message"></div>
          <form onsubmit="loginUser(event)">
            <div class="form-group"><label>Mobile / Email</label><input class="form-control" id="loginId" required></div>
            <div class="form-group"><label>Password</label><input class="form-control" id="loginPass" type="password" required></div>
            <button type="submit" class="btn btn-primary" style="width:100%">Login</button>
          </form>
        </div>
      </div>
    </div>
  `);
}

async function loginUser(e) {
  e.preventDefault();
  const msg = document.getElementById("loginMsg");
  msg.className = "message show";
  msg.textContent = "Logging in...";
  try {
    const res = await apiFetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ identifier: document.getElementById("loginId").value, password: document.getElementById("loginPass").value })
    });
    currentUser = res.user;
    updateAuthButton();
    handleAuthButton();
  } catch (err) {
    msg.className = "message show error";
    msg.textContent = err.message;
  }
}

async function logoutUser() {
  try { await apiFetch("/api/logout", { method: "POST" }); } catch (e) {}
  currentUser = null;
  updateAuthButton();
  closeInterface();
}

function escapeHtml(str) {
  return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
</script>
</body>
</html>
