<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>OUMJYOTI — भक्ति • सेवा • मानवता</title>

<meta name="description"
content="OUMJYOTI — भक्ति, सेवा और मानवता का संगम। गौ सेवा, अन्न दान, शिक्षा, बुजुर्ग सेवा, स्वास्थ्य सहायता और आपदा राहत।">

<meta name="keywords"
content="OUMJYOTI, सेवा, गौ सेवा, अन्न दान, शिक्षा सेवा, बुजुर्ग सेवा, मानवता, भक्ति, सनातन">

<meta name="theme-color" content="#0f0508">

<style>
:root{
  --bg:#0f0508;
  --card:#1c0e12;
  --card2:#241217;
  --gold:#f3ba2f;
  --gold2:#ffe898;
  --text:#f5f5f5;
  --muted:#c9b9bd;
  --green:#38c172;
  --red:#ef5350;
  --blue:#42a5f5;
  --border:rgba(243,186,47,.22);
  --shadow:0 15px 40px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:
    radial-gradient(circle at top,#32151b 0,#0f0508 42%,#090305 100%);
  color:var(--text);
  line-height:1.6;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  backdrop-filter:blur(14px);
  background:rgba(15,5,8,.92);
  border-bottom:1px solid var(--border);
}

.navbar{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  color:var(--gold);
  font-size:1.15rem;
}

.brand img{
  width:48px;
  height:48px;
  object-fit:contain;
  border-radius:50%;
}

.navlinks{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.navlinks a,
.navlinks button{
  background:none;
  border:0;
  color:var(--text);
  padding:9px 11px;
  border-radius:9px;
  transition:.2s;
}

.navlinks a:hover,
.navlinks button:hover{
  background:rgba(243,186,47,.12);
  color:var(--gold2);
}

.user-badge{
  border:1px solid var(--border);
  padding:7px 10px;
  border-radius:999px;
  color:var(--gold2);
  font-size:.88rem;
}

/* =========================
   COMMON
========================= */

section{
  padding:72px 0;
}

.section-title{
  text-align:center;
  margin-bottom:38px;
}

.section-title h2{
  margin:0 0 8px;
  color:var(--gold);
  font-size:clamp(1.8rem,4vw,2.6rem);
}

.section-title p{
  margin:0;
